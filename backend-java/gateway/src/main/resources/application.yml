server:
  port: ${PORT:8083}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: player-service
          uri: lb://player-service
          predicates:
            - Path=/api/players/**,/api-docs/player-service,/api/ideal-team/**,/api/auth/**
          filters:
            - RewritePath=/api-docs/player-service,/api-docs
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/comments/**,/api-docs/comment-service
          filters:
            - RewritePath=/api-docs/comment-service,/api-docs
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

springdoc:
  swagger-ui:
    urls:
      - name: player-service
        url: /api-docs/player-service
      - name: comment-service
        url: /api-docs/comment-service
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
    registryFetchIntervalSeconds: 10
    disable-delta: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
