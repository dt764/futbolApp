spring:
  application:
    name: comment-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:config-server}:8888
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://mi-base-datos:5432/db_sistema}
    username: ${DB_USERNAME:usuario_futbol}
    password: ${DB_PASSWORD:password_seguro123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://service-registry:8761/eureka/}
    registryFetchIntervalSeconds: 5
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      playerService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s

firebase:
  service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_B64:}