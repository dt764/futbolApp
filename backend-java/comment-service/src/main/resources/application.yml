spring:
  application:
    name: comment-service
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888

server:
  port: ${PORT:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
