version: '3.8'

networks:
  futbol-network:
    driver: bridge

services:
  # -------------------------------------------------------------
  # 1. SERVIDOR DE CONFIGURACIÓN (Config Server)
  # -------------------------------------------------------------
  config-server:
    image: config-server:latest # Ajusta con el nombre exacto de tu imagen si varía
    container_name: config-server
    restart: always
    ports:
      - "8888:8888"
    networks:
      - futbol-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. REGISTRO DE SERVICIOS (Eureka Server)
  # -------------------------------------------------------------
  service-registry:
    image: service-registry:latest # Ajusta con el nombre exacto de tu imagen
    container_name: service-registry
    restart: always
    ports:
      - "8761:8761"
    networks:
      - futbol-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. PUERTA DE ENLACE (API Gateway - ÚNICO PUNTO DE ENTRADA)
  # -------------------------------------------------------------
  api-gateway:
    image: api-gateway:latest # Ajusta con el nombre exacto de tu imagen
    container_name: api-gateway
    restart: always
    ports:
      - "8083:8083" # Este es el único puerto que necesitas atacar desde fuera
    networks:
      - futbol-network
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # -------------------------------------------------------------
  # 4. MICROSERVICIO DE JUGADORES (Player Service)
  # -------------------------------------------------------------
  player-service:
    image: player-service:latest # Ajusta con el nombre exacto de tu imagen
    container_name: player-service
    restart: always
    # PUERTOS CERRADOS AL EXTERIOR POR SEGURIDAD. Solo accesibles vía Gateway.
    networks:
      - futbol-network
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      # Si usas base de datos en Docker, añade aquí sus variables (ej. SPRING_DATASOURCE_URL)

  # -------------------------------------------------------------
  # 5. MICROSERVICIO DE COMENTARIOS (Comment Service)
  # -------------------------------------------------------------
  comment-service:
    image: comment-service:latest # Ajusta con el nombre exacto de tu imagen
    container_name: comment-service
    restart: always
    # PUERTOS CERRADOS AL EXTERIOR POR SEGURIDAD. Solo accesibles vía Gateway.
    networks:
      - futbol-network
    depends_on:
      service-registry:
        condition: service_healthy
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      # Si usas base de datos en Docker, añade aquí sus variables