services:

  postgres:
    image: postgres:15-alpine
    container_name: futbolapp-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: futbolapp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      postgres:
        condition: service_healthy

  service-registry:
    build: ./service-registry
    container_name: service-registry
    ports:
      - "8761:8761"
    depends_on:
      - config-server

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8083:8083"
    depends_on:
      - service-registry
      - config-server
    environment:
      EUREKA_URI: ${EUREKA_URI:-http://service-registry:8761/eureka/}

  player-service:
    build: ./player-service
    container_name: player-service
    ports:
      - "8081:8081"
    depends_on:
      - config-server
      - service-registry
      - postgres
    environment:
      CONFIG_SERVER_HOST: ${CONFIG_SERVER_HOST:-config-server}
      EUREKA_URI: ${EUREKA_URI:-http://service-registry:8761/eureka/}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/futbolapp}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

  comment-service:
    build: ./comment-service
    container_name: comment-service
    ports:
      - "8082:8082"
    depends_on:
      - config-server
      - service-registry
      - postgres
    environment:
      CONFIG_SERVER_HOST: ${CONFIG_SERVER_HOST:-config-server}
      EUREKA_URI: ${EUREKA_URI:-http://service-registry:8761/eureka/}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/futbolapp}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      FIREBASE_SERVICE_ACCOUNT_B64: ${FIREBASE_SERVICE_ACCOUNT_B64:-}

volumes:
  postgres-data:
