<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>FutbolApp</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="hero">
    <h1>FutbolApp</h1>
    <p>Tu app de jugadores de fútbol</p>
  </div>

  <ion-card button routerLink="/players">
    <ion-card-header>
      <ion-icon name="people-outline" slot="start"></ion-icon>
      <ion-card-title>Jugadores</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Explora la base de datos de jugadores, filtra por equipo o liga, y accede a los detalles.
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-icon name="newspaper-outline" slot="start"></ion-icon>
      <ion-card-title>Noticias</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-note>Próximamente — Noticias de fútbol vía CORBA.</ion-note>
    </ion-card-content>
  </ion-card>
</ion-content>
