<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
      <img src="assets/icon.png" alt="TactiXI" class="header-icon" />
    </ion-buttons>
    <ion-title class="header-title">Perfil</ion-title>
    <ion-buttons slot="end">
      <app-auth-header></app-auth-header>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="profile-content">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Backend activo</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>Selecciona a qué backend enviar las peticiones:</p>
        <ion-segment
          [value]="toggleService.current()"
          (ionChange)="toggleService.set($any($event).detail.value)"
          class="backend-selector"
        >
          <ion-segment-button *ngFor="let s of toggleService.all" [value]="s.type">
            <ion-icon [name]="s.type === 'trwm' ? 'server-outline' : 'cloud-outline'" slot="start"></ion-icon>
            <ion-label>{{ s.label }}</ion-label>
          </ion-segment-button>
        </ion-segment>
      </ion-card-content>
    </ion-card>

    <ion-card *ngIf="auth.isLoggedIn()">
      <ion-card-header>
        <ion-card-title>Información de usuario</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-spinner *ngIf="!auth.appUser()" class="center-spinner"></ion-spinner>
        <ion-list *ngIf="auth.appUser() as user">
          <ion-item>
            <ion-label>Email</ion-label>
            <ion-note slot="end">{{ user.email }}</ion-note>
          </ion-item>
          <ion-item *ngIf="user.displayName">
            <ion-label>Nombre</ion-label>
            <ion-note slot="end">{{ user.displayName }}</ion-note>
          </ion-item>
          <ion-item>
            <ion-label>Rol</ion-label>
            <ion-note slot="end">{{ user.role || 'usuario' }}</ion-note>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
