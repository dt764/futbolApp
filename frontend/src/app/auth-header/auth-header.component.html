<ng-container *ngIf="!isLoggedIn; else loggedIn">
  <ion-button routerLink="/login">Iniciar sesión</ion-button>
  <ion-button routerLink="/register" color="primary" fill="solid">Registro</ion-button>
</ng-container>
<ng-template #loggedIn>
  <ion-button id="user-menu-trigger">
    <ion-icon name="person-circle-outline" slot="icon-only" class="user-icon"></ion-icon>
  </ion-button>
  <ion-popover trigger="user-menu-trigger" side="bottom" alignment="end">
    <ng-template>
      <ion-content>
        <ion-list>
          <ion-item lines="none">
            <ion-label>
              <h3>{{ appUser?.displayName || appUser?.email }}</h3>
              <p>{{ appUser?.email }}</p>
            </ion-label>
          </ion-item>
          <ion-item button (click)="logout()" lines="none">
            <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
            <ion-label color="danger">Cerrar sesión</ion-label>
          </ion-item>
        </ion-list>
      </ion-content>
    </ng-template>
  </ion-popover>
</ng-template>
