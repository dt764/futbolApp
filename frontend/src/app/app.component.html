<ion-app [class.admin-theme]="isAdmin()">
  <ion-menu contentId="main-content" side="start">
    <ion-header>
      <ion-toolbar>
        <ion-title>Navegación</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <app-backend-toggle></app-backend-toggle>
      <ion-list>
        @for (page of menuPages; track page.url) {
          <ion-menu-toggle>
            <ion-item [routerLink]="page.url" lines="none" detail="false">
              <ion-icon [name]="page.icon" slot="start"></ion-icon>
              <ion-label>{{ page.title }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }
      </ion-list>

      <ion-list lines="none" class="auth-section">
        @if (!isLoggedIn()) {
          @for (page of authPages; track page.url) {
            <ion-menu-toggle>
              <ion-item [routerLink]="page.url" lines="none" detail="false">
                <ion-icon [name]="page.icon" slot="start" class="auth-icon"></ion-icon>
                <ion-label>{{ page.title }}</ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
        } @else {
          <ion-menu-toggle>
            <ion-item button (click)="logout()" lines="none" detail="false">
              <ion-icon name="log-out-outline" slot="start"></ion-icon>
              <ion-label>Cerrar sesión</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
