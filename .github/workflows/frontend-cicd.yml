name: Frontend CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cicd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

env:
  PROJECT_ID: computacionnube2026-dt764
  REGISTRY: europe-west1-docker.pkg.dev
  REPO: frontend-repo
  REGION: europe-west1

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: 🛡️ Audit dependencies
        run: npm audit --audit-level=high

      - name: 🔍 Run Lint
        run: npm run lint

      - name: 🔑 Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
          path: ./

      - name: 🧪 Cypress component tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headless: true
          working-directory: frontend
          component: true
          command: npm run test:ci

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: frontend/coverage/

      - name: Build
        run: npm run build -- --configuration production

      - name: 🧪 Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          headless: true
          working-directory: frontend
          start: npm run start
          wait-on: 'http://localhost:8100'
          command: npm run e2e:ci

      - name: 📸 Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/

      - name: Build Docker image (Local check)
        run: docker build -t football-frontend .

  deploy-develop:
    name: Deploy a develop
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest-develop

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy a Cloud Run (develop)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: football-frontend-develop
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-frontend:${{ steps.meta.outputs.version }}
          flags: '--allow-unauthenticated'

      - name: URL develop
        run: echo "Develop desplegado en ${{ steps.deploy.outputs.url }}"

  deploy-production:
    name: Deploy a producción
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy a Cloud Run (production)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: football-frontend-production
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-frontend:${{ steps.meta.outputs.version }}
          flags: '--allow-unauthenticated'

      - name: URL producción
        run: echo "Producción desplegada en ${{ steps.deploy.outputs.url }}"
