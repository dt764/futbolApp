name: Frontend CI/CD

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version para release APK (ej: 1.0.0)'
        required: false
  push:
    branches: [main, develop]
    tags:
      - 'v*'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cicd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

env:
  PROJECT_ID: computacionnube2026-dt764
  REGISTRY: europe-west1-docker.pkg.dev
  REPO: frontend-repo
  REGION: europe-west1

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: 🛡️ Audit dependencies
        run: npm audit --audit-level=high

      - name: 🔍 Run Lint
        run: npm run lint

      - name: 🔑 Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
          path: ./

      - name: 🧪 Cypress component tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          working-directory: frontend
          component: true
          command: npm run test:ci

      - name: Build
        run: npm run build -- --configuration production

      - name: 🧪 Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          working-directory: frontend
          start: npm run start
          wait-on: 'http://localhost:8100'
          command: npm run e2e:ci

      - name: Resumen de tests visuales
        run: |
          echo "## 📊 Informe de Frontend" >> $GITHUB_STEP_SUMMARY
          echo "**Component tests:** Ejecutados con Cypress" >> $GITHUB_STEP_SUMMARY
          echo "**E2E tests:** Ejecutados contra build local" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 Capturas y videos en los Artefactos:" >> $GITHUB_STEP_SUMMARY
          echo "- \`cypress-screenshots\` (solo si fallan)" >> $GITHUB_STEP_SUMMARY
          echo "- \`cypress-videos\` (solo si fallan)" >> $GITHUB_STEP_SUMMARY
          echo "- \`frontend-build\` (dist/)" >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: 📸 Upload Cypress screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots/

      - name: 📹 Upload Cypress videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: frontend/cypress/videos/

      - name: 📦 Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

      - name: Build Docker image (Local check)
        run: docker build -t football-frontend .

  deploy-develop:
    name: Deploy a develop
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest-develop

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy a Cloud Run (develop)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: football-frontend-develop
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-frontend:${{ steps.meta.outputs.version }}
          flags: '--allow-unauthenticated'

      - name: URL develop
        run: echo "Develop desplegado en ${{ steps.deploy.outputs.url }}"

  deploy-production:
    name: Deploy a producción
    runs-on: ubuntu-latest
    needs: frontend-ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy a Cloud Run (production)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: football-frontend-production
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-frontend:${{ steps.meta.outputs.version }}
          flags: '--allow-unauthenticated'

      - name: URL producción
        run: echo "Producción desplegada en ${{ steps.deploy.outputs.url }}"

  release-apk:
    name: Build APK + GitHub Release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build web app
        run: npm run build -- --configuration production
        working-directory: frontend

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Add & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
        working-directory: frontend

      - name: Copy custom icons & splash to Android project
        run: |
          if [ -d "resources/android" ]; then
            cp -r resources/android/mipmap-* android/app/src/main/res/
            cp -r resources/android/drawable android/app/src/main/res/
            echo "✅ Iconos copiados"
          else
            echo "⚠️ No hay resources/android, se usan los default"
          fi
        working-directory: frontend

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
        working-directory: frontend/android

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: frontend/android

      - name: Set APK name with version
        id: apk
        run: |
          RAW_VERSION="${{ github.event.inputs.version || github.ref_name }}"
          RAW_VERSION="${RAW_VERSION#v}"
          [ -z "$RAW_VERSION" ] && RAW_VERSION="$(date +%Y%m%d%H%M)"
          echo "version=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "apk_name=TactiXI-v$RAW_VERSION.apk" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: TactiXI v${{ steps.apk.outputs.version }}
          body: |
            ## TactiXI v${{ steps.apk.outputs.version }}

            APK generado automáticamente desde ${{ github.sha }}
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
