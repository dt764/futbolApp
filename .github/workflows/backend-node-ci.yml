name: Backend Node CI

on:
  push:
    branches:
      - main
      - develop

    paths:
      - 'backend-node/**'
      - '.github/workflows/backend-node-ci.yml'

  pull_request:
    branches:
      - main
      - develop

    paths:
      - 'backend-node/**'

jobs:
  backend-node-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend-node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t football-api .
