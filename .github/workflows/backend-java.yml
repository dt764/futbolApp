name: ☕ Backend Java - Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend-java/**'
      - '.github/workflows/backend-java.yml'

env:
  PROJECT_ID: computacionnube2026-dt764
  REGISTRY: europe-west1-docker.pkg.dev

concurrency:
  group: backend-java-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    strategy:
      matrix:
        include:
          - service: player-service
            repo: player-service-repo
          - service: comment-service
            repo: comment-service-repo
          - service: gateway
            repo: gateway-repo
          - service: service-registry
            repo: service-registry-repo
          - service: config-server
            repo: config-server-repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          cache-dependency-path: backend-java/${{ matrix.service }}/pom.xml

      - run: mvn compile -B
        working-directory: backend-java/${{ matrix.service }}

      - run: mvn verify -B
        working-directory: backend-java/${{ matrix.service }}

      - name: Resumen de cobertura
        run: |
          echo "## Informe de ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco/index.html ]; then
            COV=$(grep -oP 'Total[^%]*?(\d+\.?\d*)%' target/site/jacoco/index.html | tail -1)
            echo "**Cobertura:** $COV" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Tests:** Ejecutados en verify" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Descargar reportes](\`${{ matrix.service }}-reports\`) en los Artefactos" >> $GITHUB_STEP_SUMMARY
        shell: bash
        working-directory: backend-java/${{ matrix.service }}

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: ${{ matrix.service }} Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          working-directory: backend-java/${{ matrix.service }}

      - run: mvn package -DskipTests -B
        working-directory: backend-java/${{ matrix.service }}

      - name: Subir reportes de tests y cobertura
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-reports
          path: |
            backend-java/${{ matrix.service }}/target/site/jacoco/
            backend-java/${{ matrix.service }}/target/surefire-reports/

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Determinar Etiqueta de Docker
        id: docker-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest-production" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-develop" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - uses: docker/build-push-action@v5
        with:
          context: backend-java/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ matrix.repo }}/${{ matrix.service }}:${{ steps.docker-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ matrix.repo }}/${{ matrix.service }}:${{ github.sha }}

  deploy-develop:
    name: Deploy to VM (develop)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST_DEVELOP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: backend-java/docker-compose.vm.yml
          target: /home/${{ secrets.VM_USERNAME }}/proyecto-comun-2526-futbol/
          strip_components: 1
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          envs: REGISTRY
          host: ${{ secrets.VM_HOST_DEVELOP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/proyecto-comun-2526-futbol
            mv docker-compose.vm.yml docker-compose.yml
            gcloud auth configure-docker $REGISTRY --quiet
            docker compose pull
            docker compose up -d
            docker image prune -f

  deploy-production:
    name: Deploy to VM (production)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST_PRODUCTION }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: backend-java/docker-compose.vm.yml
          target: /home/${{ secrets.VM_USERNAME }}/proyecto-comun-2526-futbol/
          strip_components: 1
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          envs: REGISTRY
          host: ${{ secrets.VM_HOST_PRODUCTION }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/proyecto-comun-2526-futbol
            mv docker-compose.vm.yml docker-compose.yml
            gcloud auth configure-docker $REGISTRY --quiet
            docker compose pull
            docker compose up -d
            docker image prune -f
