name: Java Gateway

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend-java/gateway/**'
      - '.github/workflows/backend-java-gateway.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend-java/gateway/**'

env:
  PROJECT_ID: computacionnube2026-dt764
  REGISTRY: europe-west1-docker.pkg.dev
  REPO: gateway-repo
  REGION: europe-west1
  SERVICE: gateway
  PORT: 8083

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: backend-java/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          cache-dependency-path: backend-java/gateway/pom.xml
      - run: mvn compile -B
      - run: mvn verify -B
      - name: Resumen de cobertura
        run: |
          echo "## 📊 Informe de ${{ env.SERVICE }}" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco/index.html ]; then
            COV=$(grep -oP 'Total[^%]*?(\d+\.?\d*)%' target/site/jacoco/index.html | tail -1)
            echo "**Cobertura:** $COV" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Tests:** Ejecutados en verify" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 [Descargar reportes](\`${{ env.SERVICE }}-reports\`) en los Artefactos" >> $GITHUB_STEP_SUMMARY
        shell: bash
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: ${{ env.SERVICE }} Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          working-directory: backend-java/gateway
      - run: mvn package -DskipTests -B
      - name: Subir reportes de tests y cobertura
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SERVICE }}-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
      - run: docker build -t $SERVICE .

  deploy-develop:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Obtener URL de service-registry
        id: registry
        run: |
          URL=$(gcloud run services describe service-registry-develop \
            --region=${{ env.REGION }} --format='value(status.url)' 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Esperar a que service-registry responda
        if: steps.registry.outputs.url != ''
        run: |
          until curl -sf ${{ steps.registry.outputs.url }}/actuator/health; do
            echo "Esperando a service-registry..."
            sleep 5
          done

      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest-develop
      - uses: docker/build-push-action@v5
        with:
          context: ./backend-java/${{ env.SERVICE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}-develop
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ steps.meta.outputs.version }}
          flags: '--allow-unauthenticated --port=${{ env.PORT }}'
          env_vars: |
            EUREKA_URI=${{ steps.registry.outputs.url }}/eureka/
      - run: echo "Desplegado en ${{ steps.deploy.outputs.url }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Obtener URL de service-registry
        id: registry
        run: |
          URL=$(gcloud run services describe service-registry-production \
            --region=${{ env.REGION }} --format='value(status.url)' 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Esperar a que service-registry responda
        if: steps.registry.outputs.url != ''
        run: |
          until curl -sf ${{ steps.registry.outputs.url }}/actuator/health; do
            echo "Esperando a service-registry..."
            sleep 5
          done

      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: ./backend-java/${{ env.SERVICE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}-production
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ steps.meta.outputs.version }}
          flags: '--allow-unauthenticated --port=${{ env.PORT }}'
          env_vars: |
            EUREKA_URI=${{ steps.registry.outputs.url }}/eureka/
      - run: echo "Desplegado en ${{ steps.deploy.outputs.url }}"


