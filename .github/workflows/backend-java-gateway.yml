name: ☕ Gateway

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend-java/gateway/**'
      - '.github/workflows/backend-java-gateway.yml'

env:
  PROJECT_ID: computacionnube2026-dt764
  REGISTRY: europe-west1-docker.pkg.dev
  REPO: gateway-repo
  SERVICE: gateway

# 🔒 Serializa los deploys al mismo VM para evitar colisiones entre workflows
concurrency:
  group: deploy-${{ github.ref_name }}-vm
  cancel-in-progress: false

jobs:
  build-and-push:
    name: 🏗️ Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: backend-java/gateway
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          cache-dependency-path: backend-java/gateway/pom.xml
          
      - run: mvn compile -B
      - run: mvn verify -B
      
      - name: Resumen de cobertura
        run: |
          echo "## 📊 Informe de ${{ env.SERVICE }}" >> $GITHUB_STEP_SUMMARY
          if [ -f target/site/jacoco/index.html ]; then
            COV=$(grep -oP 'Total[^%]*?(\d+\.?\d*)%' target/site/jacoco/index.html | tail -1)
            echo "**Cobertura:** $COV" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Tests:** Ejecutados en verify" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📁 [Descargar reportes](\`${{ env.SERVICE }}-reports\`) en los Artefactos" >> $GITHUB_STEP_SUMMARY
        shell: bash
        
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: ${{ env.SERVICE }} Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          working-directory: backend-java/gateway
          
      - run: mvn package -DskipTests -B
      
      - name: Subir reportes de tests y cobertura
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SERVICE }}-reports
          path: |
            backend-java/gateway/target/site/jacoco/
            backend-java/gateway/target/surefire-reports/

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          
      - run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      
      - uses: docker/setup-buildx-action@v3

      - name: Determinar Etiqueta de Docker
        id: docker-tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest-production" >> $GITHUB_OUTPUT
          else
            echo "tag=latest-develop" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - uses: docker/build-push-action@v5
        with:
          context: ./backend-java/${{ env.SERVICE }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ steps.docker-tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}

  deploy-develop:
    name: 🚀 Deploy to VM (develop)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    steps:
      - name: 🔗 SSH into VM Develop and Update ${{ env.SERVICE }}
        uses: appleboy/ssh-action@v1
        with:
          envs: REGISTRY,SERVICE
          host: ${{ secrets.VM_HOST_DEVELOP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            gcloud auth configure-docker $REGISTRY --quiet
            cd ~/proyecto-comun-2526-futbol
            docker compose pull $SERVICE
            docker compose up -d --no-deps $SERVICE
            docker image prune -f || true   # 🛡️ no falla si otro prune está corriendo

  deploy-production:
    name: 🚀 Deploy to VM (production)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - name: 🔗 SSH into VM Production and Update ${{ env.SERVICE }}
        uses: appleboy/ssh-action@v1
        with:
          envs: REGISTRY,SERVICE
          host: ${{ secrets.VM_HOST_PRODUCTION }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            gcloud auth configure-docker $REGISTRY --quiet
            cd ~/proyecto-comun-2526-futbol
            docker compose pull $SERVICE
            docker compose up -d --no-deps $SERVICE
            docker image prune -f || true   # 🛡️ no falla si otro prune está corriendo