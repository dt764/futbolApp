name: Deploy docker-compose to VM

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: europe-west1-docker.pkg.dev
  SERVICE: futbol-stack

concurrency:
  group: deploy-${{ github.ref_name }}-vm
  cancel-in-progress: false

jobs:
  deploy-develop:
    name: Deploy to VM (develop)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST_DEVELOP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: backend-java/docker-compose.vm.yml
          target: /home/${{ secrets.VM_USERNAME }}/proyecto-comun-2526-futbol/
          strip_components: 1
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          envs: REGISTRY,SERVICE
          host: ${{ secrets.VM_HOST_DEVELOP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/proyecto-comun-2526-futbol
            mv docker-compose.vm.yml docker-compose.yml
            gcloud auth configure-docker $REGISTRY --quiet
            docker compose pull
            docker compose up -d

  deploy-production:
    name: Deploy to VM (production)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VM
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VM_HOST_PRODUCTION }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: backend-java/docker-compose.vm.yml
          target: /home/${{ secrets.VM_USERNAME }}/proyecto-comun-2526-futbol/
          strip_components: 1
          overwrite: true

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          envs: REGISTRY,SERVICE
          host: ${{ secrets.VM_HOST_PRODUCTION }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/proyecto-comun-2526-futbol
            mv docker-compose.vm.yml docker-compose.yml
            gcloud auth configure-docker $REGISTRY --quiet
            docker compose pull
            docker compose up -d