name: Backend Node CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend-node/**'
      - '.github/workflows/backend-node-cicd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend-node/**'

env:
  PROJECT_ID: computacionnube2026-dt764
  REGISTRY: europe-west1-docker.pkg.dev
  REPO: mi-repo
  REGION: europe-west1

jobs:
  backend-node-ci:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    defaults:
      run:
        working-directory: backend-node
    
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para algunos analizadores que revisan historial

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-node/package-lock.json

      - name: Install dependencies
        run: npm ci # 'ci' es más estricto y rápido que 'install' en pipelines

      - name: 🛡️ Audit dependencies
        run: npm audit --audit-level=high
        # Esto fallará si hay vulnerabilidades de nivel alto o crítico

      - name: 🔍 Run Lint (ESLint)
        run: npm run lint

      - name: 🔑 Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
          path: ./

      # --------------------------------------------------

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGO_URI_TEST: mongodb://localhost:27017/futbolapp-test

      - name: Resumen de cobertura
        run: |
          echo "## 📊 Informe de Backend Node" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/lcov-report/index.html ]; then
            COV=$(grep -oP '<span class="strong">\K[\d.]+(?=%)' coverage/lcov-report/index.html | head -1)
            echo "**Cobertura:** ${COV}%" >> $GITHUB_STEP_SUMMARY
          fi
          echo "📁 [Descargar reportes](node-reports) en los Artefactos" >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Backend Node Tests
          path: reports/junit.xml
          reporter: java-junit
          working-directory: backend-node

      - name: Subir reportes de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: node-reports
          path: coverage/

      - name: Build Docker image (Local check)
        run: docker build -t football-api .

  deploy-develop:
    name: Deploy a develop
    runs-on: ubuntu-latest
    needs: backend-node-ci
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest-develop

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy a Cloud Run (develop)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: football-api-develop
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-api:${{ steps.meta.outputs.version }}
          flags: '--allow-unauthenticated'
          env_vars: |
            MONGO_URI=${{ secrets.MONGO_URI }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            API_FOOTBALL_KEY=${{ secrets.API_FOOTBALL_KEY }}
            FIREBASE_SERVICE_ACCOUNT_B64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
            FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}

      - name: URL develop
        run: echo "Develop desplegado en ${{ steps.deploy.outputs.url }}"

  deploy-production:
    name: Deploy a producción
    runs-on: ubuntu-latest
    needs: backend-node-ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Configurar buildx
        uses: docker/setup-buildx-action@v3

      - name: Metadata de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build y Push imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: ./backend-node
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy a Cloud Run (production)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: football-api-production
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/football-api:${{ steps.meta.outputs.version }}
          flags: '--allow-unauthenticated'
          env_vars: |
            MONGO_URI=${{ secrets.MONGO_URI }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            API_FOOTBALL_KEY=${{ secrets.API_FOOTBALL_KEY }}
            FIREBASE_SERVICE_ACCOUNT_B64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
            FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}

      - name: URL producción
        run: echo "Producción desplegada en ${{ steps.deploy.outputs.url }}"